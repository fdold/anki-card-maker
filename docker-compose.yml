services:
  ollama-default:
    image: ollama/ollama:latest
    container_name: anki-card-maker-ollama-default
    ports:
      - "11434:11434"
    volumes:
      - ollama-default-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

  ollama-init:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: anki-card-maker-ollama-init
    depends_on:
      ollama-default:
        condition: service_healthy
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      ANKI_CARD_MAKER_MODEL_PROFILES_FILE: "/app/docker/model_profiles.dev.json"
      OLLAMA_INIT_BASE_URL: "http://ollama-default:11434"
    command: python -m backend.models.ollama_init
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: anki-card-maker-backend
    depends_on:
      ollama-default:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      ANKI_CARD_MAKER_MODEL_PROFILES_FILE: "/app/docker/model_profiles.dev.json"
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: anki-card-maker-frontend
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./:/app
    environment:
      PYTHONUNBUFFERED: "1"
      ANKI_CARD_MAKER_API_URL: "http://backend:8000"
    ports:
      - "8501:8501"
    command: uvicorn frontend.web:app --host 0.0.0.0 --port 8501 --reload

volumes:
  ollama-default-data:
